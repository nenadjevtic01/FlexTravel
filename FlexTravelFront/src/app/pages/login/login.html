<div class="container page">
  <div class="card login">
    <span class="eyebrow">Welcome back</span>
    <h1>Sign in</h1>

    <form (submit)="submit($event)">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          class="input"
          type="email"
          autocomplete="username"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          required
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          class="input"
          type="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          required
        />
      </div>

      <label class="remember">
        <input
          type="checkbox"
          [checked]="rememberMe()"
          (change)="rememberMe.set($any($event.target).checked)"
        />
        <span>
          Keep me signed in
          <small class="muted"
            >for 30 days on this device; otherwise until you close the browser</small
          >
        </span>
      </label>

      @if (error(); as message) {
        <p class="alert">{{ message }}</p>
      }

      <button class="btn btn-primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="hint muted">
      No account yet?
      <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl() }">Create one</a>
    </p>
    <p class="hint muted">
      Test accounts are created when the database is seeded (see <code>README.md</code> in the
      project root).
    </p>
  </div>
</div>
