<button
  type="button"
  class="bell"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'Notifications, ' + notifications.unreadCount() + ' unread'"
  (click)="toggle($event)"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path
      d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"
      fill="currentColor"
    />
  </svg>
  @if (notifications.unreadCount() > 0) {
    <span class="count">{{
      notifications.unreadCount() > 9 ? '9+' : notifications.unreadCount()
    }}</span>
  }
  <span
    class="dot"
    [class.on]="notifications.live()"
    [title]="notifications.live() ? 'Live' : 'Offline'"
  ></span>
</button>

@if (open()) {
  <div
    class="panel card"
    role="dialog"
    aria-label="Notifications"
    (click)="$event.stopPropagation()"
  >
    <div class="panel-head">
      <strong>Notifications</strong>
      <span class="muted small">{{ notifications.live() ? '● live' : 'offline' }}</span>
    </div>
    @for (n of notifications.items(); track n.id) {
      <button type="button" class="item" [class.unread]="!n.isRead" (click)="openNotification(n)">
        <span class="icon" aria-hidden="true">{{ icon(n) }}</span>
        <span class="text">
          <strong>{{ n.title }}</strong>
          <span class="message">{{ n.message }}</span>
          <span class="muted small">{{ ago(n.createdAt) }}</span>
        </span>
      </button>
    } @empty {
      <p class="muted empty">Nothing yet. You will see reservation updates here.</p>
    }
  </div>
}
